<script>
(function() {
  const INTERVAL_MS = 5000;
  const VISIBLE_BUTTONS = 5;

  function getLang() {
    if (window.__getLang) return window.__getLang();
    var lang = document.documentElement.getAttribute('lang');
    return (lang === 'zh-CN' ? 'zh-CN' : 'en');
  }

  function getStrings() {
    return (window.__i18n && window.__i18n[getLang()]) || (window.__i18n && window.__i18n.en) || {};
  }

  function getData() {
    var enEl = document.getElementById('projectsPageDataEn');
    var cnEl = document.getElementById('projectsPageDataCn');
    try {
      var en = enEl && enEl.textContent ? JSON.parse(enEl.textContent) : [];
      var cn = cnEl && cnEl.textContent ? JSON.parse(cnEl.textContent) : [];
      return getLang() === 'zh-CN' ? cn : en;
    } catch (e) { return []; }
  }

  function firstPageTitle(title) {
    var raw = title || '';
    var dash = raw.indexOf('-');
    if (dash === -1) return raw;
    return raw.slice(0, dash).replace(/\s+$/, '');
  }

  function escapeHtml(text) {
    return String(text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildDescHtml(text) {
    return '<div class="projects-desc-text">' +
      '<div class="projects-desc-text-viewport">' +
        '<div class="projects-desc-text-body">' + escapeHtml(text) + '</div>' +
      '</div>' +
      '<div class="projects-desc-text-nav" hidden>' +
        '<button type="button" class="projects-desc-text-prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>' +
        '<button type="button" class="projects-desc-text-next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>' +
      '</div>' +
    '</div>';
  }

  function buildCards(project) {
    if (!project) return { imageCards: [], descCards: [] };

    var imageCards = [];
    var descCards = [];

    // Card 0: thumbnail + description
    var thumbHtml = project.thumbnail
      ? '<img src="' + project.thumbnail.replace(/"/g, '&quot;') + '" alt="">'
      : '<div class="projects-image-placeholder"><i class="fa-solid fa-image"></i></div>';
    imageCards.push(thumbHtml);
    var coverTitle = firstPageTitle(project.title);
    descCards.push(
      '<h3 class="projects-desc-title">' + escapeHtml(coverTitle) + '</h3>' +
      buildDescHtml(project.description)
    );

    // Cards 1-4: imageN + image_title_N + descriptionN
    for (var n = 1; n <= 4; n++) {
      var img = project['image' + n];
      var slideTitle = project['image_title_' + n] || '';
      var desc = project['description' + n] || '';
      var imgHtml = img
        ? '<img src="' + img.replace(/"/g, '&quot;') + '" alt="">'
        : '<div class="projects-image-placeholder"><i class="fa-solid fa-image"></i></div>';
      imageCards.push(imgHtml);
      var titleHtml = slideTitle
        ? '<h3 class="projects-desc-title">' + escapeHtml(slideTitle) + '</h3>'
        : '';
      descCards.push(titleHtml + buildDescHtml(desc));
    }

    return { imageCards: imageCards, descCards: descCards };
  }

  var state = {
    projects: [],
    currentProjectIndex: 0,
    currentCardIndex: 0,
    cardCount: 0,
    autoTimer: null
  };

  var imageTrack = document.getElementById('projectsImageTrack');
  var descTrack = document.getElementById('projectsDescTrack');
  var imageDots = document.getElementById('projectsImageDots');
  var strip = document.getElementById('projectsStrip');
  var navLeft = document.getElementById('projectsNavLeft');
  var navRight = document.getElementById('projectsNavRight');
  var openBtn = document.getElementById('projectsOpenBtn');

  if (!imageTrack || !descTrack) return;

  function updateOpenButton(project) {
    if (!openBtn) return;
    var strings = getStrings();
    var openProject = (strings['buttons.click_to_open'] != null ? strings['buttons.click_to_open'] : 'Click to Open');
    openBtn.href = (project && project.projectUrl) ? project.projectUrl : '#';
    var label = openBtn.querySelector('.i18n-text');
    if (label) label.textContent = openProject;
    openBtn.style.visibility = (project && project.projectUrl) ? 'visible' : 'hidden';
  }

  function renderProjectButtons() {
    if (!strip) return;
    var list = state.projects;
    strip.innerHTML = list.map(function(p, i) {
      var active = i === state.currentProjectIndex ? ' is-active' : '';
      var label = isMobileProjectsLayout() ? firstPageTitle(p.title) : (p.title || '');
      return '<button type="button" class="projects-strip-btn' + active + '" data-index="' + i + '">' +
        escapeHtml(label) + '</button>';
    }).join('');
    updateStripNavState();
  }

  function updateStripNavState() {
    var list = state.projects;
    var atStart = !list.length || state.currentProjectIndex <= 0;
    var atEnd = !list.length || state.currentProjectIndex >= list.length - 1;
    if (navLeft) {
      navLeft.disabled = isMobileProjectsLayout() ? atStart : false;
      navLeft.classList.toggle('is-disabled', isMobileProjectsLayout() && atStart);
    }
    if (navRight) {
      navRight.disabled = isMobileProjectsLayout() ? atEnd : false;
      navRight.classList.toggle('is-disabled', isMobileProjectsLayout() && atEnd);
    }
  }

  function syncCarouselWidths() {
    var imageViewport = imageTrack.parentElement;
    var descViewport = descTrack.parentElement;
    var imageW = imageViewport ? Math.round(imageViewport.getBoundingClientRect().width) : 0;
    var descW = descViewport ? Math.round(descViewport.getBoundingClientRect().width) : 0;
    if (imageViewport && imageW > 0) {
      imageViewport.style.setProperty('--projects-image-slide-w', imageW + 'px');
    }
    if (descViewport && descW > 0) {
      descViewport.style.setProperty('--projects-desc-slide-w', descW + 'px');
    }
    return { imageW: imageW, descW: descW };
  }

  function slideOffsetX(track, index) {
    var slide = track.children[index];
    if (!slide) return 0;
    return slide.offsetLeft;
  }

  function goToCard(index) {
    if (state.cardCount <= 0) return;
    state.currentCardIndex = (index + state.cardCount) % state.cardCount;
    syncCarouselWidths();
    // Force layout so offsetLeft reflects the synced slide widths
    void imageTrack.offsetWidth;
    void descTrack.offsetWidth;
    imageTrack.style.transform = 'translate3d(' + (-slideOffsetX(imageTrack, state.currentCardIndex)) + 'px, 0, 0)';
    descTrack.style.transform = 'translate3d(' + (-slideOffsetX(descTrack, state.currentCardIndex)) + 'px, 0, 0)';
    var dots = document.querySelectorAll('.projects-image-dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('is-active', i === state.currentCardIndex);
      dots[i].setAttribute('aria-current', i === state.currentCardIndex ? 'true' : 'false');
    }
  }

  function startAuto() {
    if (state.autoTimer) clearInterval(state.autoTimer);
    state.autoTimer = null;
    if (state.cardCount > 1) {
      state.autoTimer = setInterval(function() {
        goToCard(state.currentCardIndex + 1);
      }, INTERVAL_MS);
    }
  }
  function stopAuto() {
    if (state.autoTimer) clearInterval(state.autoTimer);
    state.autoTimer = null;
  }

  function fitDescTitles() {
    var titles = descTrack.querySelectorAll('.projects-desc-title');
    for (var i = 0; i < titles.length; i++) {
      var el = titles[i];
      el.style.fontSize = '';
      var maxPx = parseFloat(window.getComputedStyle(el).fontSize) || 22.4;
      var minPx = 12;
      var size = maxPx;
      el.style.fontSize = size + 'px';
      while (el.scrollWidth > el.clientWidth + 0.5 && size > minPx) {
        size -= 0.5;
        el.style.fontSize = size + 'px';
      }
    }
  }

  function isMobileProjectsLayout() {
    return window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  }

  function resetDescBodyStyles(body) {
    if (!body) return;
    body.style.height = '';
    body.style.width = '';
    body.style.columnWidth = '';
    body.style.columnGap = '';
    body.style.columnFill = '';
    body.style.transform = '';
  }

  function initDescPagers() {
    var boxes = descTrack.querySelectorAll('.projects-desc-text');
    var mobile = isMobileProjectsLayout();

    for (var i = 0; i < boxes.length; i++) {
      (function(box) {
        var viewport = box.querySelector('.projects-desc-text-viewport');
        var body = box.querySelector('.projects-desc-text-body');
        var nav = box.querySelector('.projects-desc-text-nav');
        var prev = box.querySelector('.projects-desc-text-prev');
        var next = box.querySelector('.projects-desc-text-next');
        if (!viewport || !body || !nav || !prev || !next) return;

        resetDescBodyStyles(body);
        prev.onclick = null;
        next.onclick = null;

        // Mobile: vertical scroll, no side arrows
        if (mobile) {
          nav.hidden = true;
          box.classList.add('is-scrollable');
          viewport.scrollTop = 0;
          return;
        }

        box.classList.remove('is-scrollable');
        var pageW = viewport.clientWidth;
        var pageH = viewport.clientHeight;
        if (pageW <= 0 || pageH <= 0) {
          nav.hidden = true;
          return;
        }

        body.style.height = pageH + 'px';
        body.style.width = 'auto';
        body.style.columnWidth = pageW + 'px';
        body.style.columnGap = '0px';
        body.style.columnFill = 'auto';
        body.style.transform = 'translateX(0)';

        var totalW = body.scrollWidth;
        var pages = totalW <= pageW + 1 ? 1 : Math.ceil(totalW / pageW);
        var page = 0;

        function update() {
          body.style.transform = 'translateX(' + (-page * pageW) + 'px)';
          if (pages <= 1) {
            nav.hidden = true;
            return;
          }
          nav.hidden = false;
          prev.disabled = page <= 0;
          next.disabled = page >= pages - 1;
        }

        prev.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          stopAuto();
          if (page > 0) {
            page -= 1;
            update();
          }
        };
        next.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          stopAuto();
          if (page < pages - 1) {
            page += 1;
            update();
          }
        };
        update();
      })(boxes[i]);
    }
  }

  function setProject(index) {
    var list = state.projects;
    if (!list.length) return;
    state.currentProjectIndex = (index + list.length) % list.length;
    var project = list[state.currentProjectIndex];
    var cards = buildCards(project);
    state.cardCount = cards.imageCards.length;

    imageTrack.innerHTML = cards.imageCards.map(function(html) {
      return '<div class="projects-image-slide">' + html + '</div>';
    }).join('');
    descTrack.innerHTML = cards.descCards.map(function(html) {
      return '<div class="projects-desc-slide">' + (html ? html : '') + '</div>';
    }).join('');

    imageDots.innerHTML = '';
    for (var i = 0; i < state.cardCount; i++) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'projects-image-dot' + (i === 0 ? ' is-active' : '');
      btn.setAttribute('data-index', String(i));
      btn.setAttribute('aria-label', 'Slide ' + (i + 1));
      btn.setAttribute('aria-current', i === 0 ? 'true' : 'false');
      imageDots.appendChild(btn);
    }

    state.currentCardIndex = 0;
    goToCard(0);
    startAuto();
    renderProjectButtons();
    updateOpenButton(project);
    requestAnimationFrame(function() {
      syncCarouselWidths();
      goToCard(state.currentCardIndex);
      fitDescTitles();
      initDescPagers();
    });

    imageDots.querySelectorAll('.projects-image-dot').forEach(function(btn, i) {
      btn.addEventListener('click', function() {
        goToCard(i);
        startAuto();
      });
    });
  }

  var projectSwitching = false;
  var SLIDE_MS = 260;

  function getProjectSlideTargets() {
    return [
      document.querySelector('.projects-strip-wrap'),
      document.querySelector('.projects-showcase')
    ].filter(Boolean);
  }

  function clearProjectSlideClasses(el) {
    el.classList.remove(
      'is-slide-out-left',
      'is-slide-out-right',
      'is-slide-in-from-left',
      'is-slide-in-from-right'
    );
  }

  // direction: 'next' = content exits left / enters from right
  //            'prev' = content exits right / enters from left
  function setProjectWithSlide(index, direction) {
    if (!isMobileProjectsLayout()) {
      setProject(index);
      return;
    }
    if (projectSwitching) return;
    if (index === state.currentProjectIndex) return;

    var targets = getProjectSlideTargets();
    if (!targets.length) {
      setProject(index);
      return;
    }

    projectSwitching = true;
    var outClass = direction === 'next' ? 'is-slide-out-left' : 'is-slide-out-right';
    var inClass = direction === 'next' ? 'is-slide-in-from-right' : 'is-slide-in-from-left';

    targets.forEach(function(el) {
      clearProjectSlideClasses(el);
      void el.offsetWidth;
      el.classList.add(outClass);
    });

    var finished = false;
    function afterOut() {
      if (finished) return;
      finished = true;
      setProject(index);
      targets.forEach(function(el) {
        clearProjectSlideClasses(el);
        void el.offsetWidth;
        el.classList.add(inClass);
      });
      setTimeout(function() {
        targets.forEach(clearProjectSlideClasses);
        projectSwitching = false;
      }, SLIDE_MS);
    }

    var primary = targets[0];
    primary.addEventListener('animationend', afterOut, { once: true });
    setTimeout(afterOut, SLIDE_MS + 40);
  }

  function init() {
    state.projects = getData();
    if (!state.projects.length) {
      var strings = getStrings();
      var empty = (strings['projects_page.empty'] != null ? strings['projects_page.empty'] : 'No projects yet.');
      imageTrack.innerHTML = '<div class="projects-desc-slide"><p class="projects-desc-text">' + empty + '</p></div>';
      descTrack.innerHTML = '<div class="projects-desc-slide"></div>';
      imageDots.innerHTML = '';
      if (strip) strip.innerHTML = '';
      updateOpenButton(null);
      return;
    }
    setProject(0);
  }

  if (strip) {
    strip.addEventListener('click', function(e) {
      var btn = e.target.closest('.projects-strip-btn');
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-index'), 10);
      if (!isNaN(idx)) setProject(idx);
    });
  }

  var carouselWrap = document.getElementById('projectsImageCarousel');
  if (carouselWrap) {
    carouselWrap.addEventListener('mouseenter', stopAuto);
    carouselWrap.addEventListener('mouseleave', startAuto);
  }

  function bindSwipe(el, onLeft, onRight) {
    if (!el) return;
    var startX = 0;
    var startY = 0;
    var active = false;
    el.addEventListener('touchstart', function(e) {
      if (!e.touches || !e.touches[0]) return;
      active = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', function(e) {
      if (!active || !e.changedTouches || !e.changedTouches[0]) return;
      active = false;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) < 42 || Math.abs(dx) < Math.abs(dy) * 1.15) return;
      if (dx < 0) onLeft();
      else onRight();
    }, { passive: true });
  }

  // Swipe image area to change carousel slides
  bindSwipe(carouselWrap, function() {
    goToCard(state.currentCardIndex + 1);
    startAuto();
  }, function() {
    goToCard(state.currentCardIndex - 1);
    startAuto();
  });

  // Swipe description area: on mobile only change slides (text scrolls vertically);
  // on desktop, page text first when multi-page.
  var descCarousel = document.getElementById('projectsDescCarousel');
  bindSwipe(descCarousel, function() {
    if (!isMobileProjectsLayout()) {
      var slide = descTrack && descTrack.children[state.currentCardIndex];
      var nav = slide && slide.querySelector('.projects-desc-text-nav');
      var nextBtn = slide && slide.querySelector('.projects-desc-text-next');
      if (nav && !nav.hidden && nextBtn && !nextBtn.disabled) {
        nextBtn.click();
        return;
      }
    }
    goToCard(state.currentCardIndex + 1);
    startAuto();
  }, function() {
    if (!isMobileProjectsLayout()) {
      var slide = descTrack && descTrack.children[state.currentCardIndex];
      var nav = slide && slide.querySelector('.projects-desc-text-nav');
      var prevBtn = slide && slide.querySelector('.projects-desc-text-prev');
      if (nav && !nav.hidden && prevBtn && !prevBtn.disabled) {
        prevBtn.click();
        return;
      }
    }
    goToCard(state.currentCardIndex - 1);
    startAuto();
  });

  if (navLeft) {
    navLeft.addEventListener('click', function() {
      var list = state.projects;
      if (!list.length) return;
      if (isMobileProjectsLayout()) {
        if (state.currentProjectIndex <= 0) return;
        setProjectWithSlide(state.currentProjectIndex - 1, 'prev');
        return;
      }
      var wrap = document.querySelector('.projects-strip-wrap');
      if (wrap) wrap.scrollBy({ left: -Math.max(wrap.clientWidth * 0.8, 160), behavior: 'smooth' });
    });
  }
  if (navRight) {
    navRight.addEventListener('click', function() {
      var list = state.projects;
      if (!list.length) return;
      if (isMobileProjectsLayout()) {
        if (state.currentProjectIndex >= list.length - 1) return;
        setProjectWithSlide(state.currentProjectIndex + 1, 'next');
        return;
      }
      var wrap = document.querySelector('.projects-strip-wrap');
      if (wrap) wrap.scrollBy({ left: Math.max(wrap.clientWidth * 0.8, 160), behavior: 'smooth' });
    });
  }

  // Mobile: swipe the single project tab to switch projects
  var stripWrap = document.querySelector('.projects-strip-wrap');
  bindSwipe(stripWrap, function() {
    if (!isMobileProjectsLayout()) return;
    var list = state.projects;
    if (!list.length || state.currentProjectIndex >= list.length - 1) return;
    setProjectWithSlide(state.currentProjectIndex + 1, 'next');
  }, function() {
    if (!isMobileProjectsLayout()) return;
    if (state.currentProjectIndex <= 0) return;
    setProjectWithSlide(state.currentProjectIndex - 1, 'prev');
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  var resizeTimer = null;
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      renderProjectButtons();
      syncCarouselWidths();
      goToCard(state.currentCardIndex);
      fitDescTitles();
      initDescPagers();
      updateStripNavState();
    }, 120);
  });
  window.addEventListener('orientationchange', function() {
    setTimeout(function() {
      renderProjectButtons();
      syncCarouselWidths();
      goToCard(state.currentCardIndex);
      fitDescTitles();
      initDescPagers();
      updateStripNavState();
    }, 200);
  });

  document.addEventListener('lang-applied', function(e) {
    state.projects = getData();
    if (state.projects.length) setProject(state.currentProjectIndex);
    else init();
  });
})();
</script>

      window.__getLang = getLang;
      window.__applyLang = applyLang;
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function() { applyLang(getLang()); });
      else applyLang(getLang());
    })();
  </script>

  <script async src="https://cdn.snipcart.com/themes/v3.4.0/default/snipcart.js"></script>
  <div hidden id="snipcart"
       data-api-key="YOUR_SNIPCART_API_KEY"
       data-config-modal-style="side"
       data-config-add-product-behavior="none"
       data-config-currency="usd"
       data-config-payment-methods="card,alipay">
  </div>

  <script>
    (function() {
      var header = document.querySelector('header.site-header');
      if (!header) return;

      var toggle = header.querySelector('.nav-toggle');
      var nav = header.querySelector('#site-nav');
      var backdrop = header.querySelector('.nav-backdrop');
      if (!toggle || !nav) return;

      function updateHeaderHeightVar() {
        var h = header.offsetHeight || 0;
        document.documentElement.style.setProperty('--site-header-height', h + 'px');
      }

      updateHeaderHeightVar();

      if (location.hash === '#home-achievements') {
        var alignAchievements = function () {
          var target = document.getElementById('home-achievements');
          if (!target) return;
          var h = header.offsetHeight || 72;
          var top = target.getBoundingClientRect().top + window.pageYOffset - h - 1;
          window.scrollTo(0, Math.max(0, Math.round(top)));
        };
        requestAnimationFrame(function () {
          requestAnimationFrame(alignAchievements);
        });
        window.addEventListener('load', function () {
          setTimeout(alignAchievements, 50);
        });
      }

      function lockScroll() {
        var scrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.dataset.navScrollY = String(scrollY);
        document.body.classList.add('nav-locked');
        document.body.style.position = 'fixed';
        document.body.style.top = '-' + scrollY + 'px';
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }

      function unlockScroll() {
        var scrollY = parseInt(document.body.dataset.navScrollY || '0', 10) || 0;
        document.body.classList.remove('nav-locked');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        delete document.body.dataset.navScrollY;
        window.scrollTo(0, scrollY);
      }

      function setOpen(open) {
        if (open === header.classList.contains('nav-open')) return;
        header.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) lockScroll();
        else unlockScroll();
      }

      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        setOpen(!header.classList.contains('nav-open'));
      });

      nav.addEventListener('click', function(e) {
        var link = e.target && e.target.closest ? e.target.closest('a') : null;
        if (link) setOpen(false);
      });

      document.addEventListener('click', function(e) {
        if (header.classList.contains('nav-open') && !header.contains(e.target)) setOpen(false);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && header.classList.contains('nav-open')) setOpen(false);
      });

      window.addEventListener('resize', function() {
        updateHeaderHeightVar();
        if (window.innerWidth > 768 && header.classList.contains('nav-open')) setOpen(false);
      });

      if (backdrop) {
        backdrop.addEventListener('click', function() {
          if (header.classList.contains('nav-open')) setOpen(false);
        });
      }
    })();
  </script>
</body>

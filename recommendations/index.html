    (function () {
      var LANG_KEY = 'site-lang';
      function getLang() {
        try {
          var q = new URLSearchParams(window.location.search).get('lang');

          return localStorage.getItem(LANG_KEY) || 'zh-CN';

      function applyMetaLang(lang) {
        var nodes = document.querySelectorAll('meta[data-en], meta[data-zh], title');
        // title tag has no data-en; sync from meta[name=title]
        var metaTitle = document.querySelector('meta[name="title"]');
        var pick = function (el) {
          if (!el) return;
          var v = lang === 'zh-CN' ? (el.getAttribute('data-zh') || el.getAttribute('data-en')) : (el.getAttribute('data-en') || el.getAttribute('data-zh'));
          if (v != null && v !== '') el.setAttribute('content', v);
        };
        pick(document.querySelector('meta[name="title"]'));
        pick(document.querySelector('meta[name="description"]'));
        pick(document.querySelector('meta[name="author"]'));
        pick(document.querySelector('meta[property="og:title"]'));
        pick(document.querySelector('meta[property="og:description"]'));
        if (metaTitle) {
          var nextTitle = lang === 'zh-CN'
            ? (metaTitle.getAttribute('data-zh') || metaTitle.getAttribute('data-en'))
            : (metaTitle.getAttribute('data-en') || metaTitle.getAttribute('data-zh'));
          if (nextTitle) document.title = nextTitle;
        }
      }
      applyMetaLang(getLang());
      window.__applyMetaLang = applyMetaLang;
    })();
  </script>

k":10,"title":"Fleabag","image":"","rate":5,"notes":"just…amazing","type":"tv series","artist":"","author":"","release_date":"2016","tab":"tv"}],"movie":[{"rank":1,"title":"Spotlight","image":"/recommendation-img/movie-1.webp","rate":5,"notes":"有段时间看《聚焦》几乎成了我最喜欢的放松方式...即使成年后的日子大部分时间都迷失在琐碎平淡的日常里，但不可避免地，或许有时候是冷静地放任自己，去直面这个世界的暗面。当人类毫不掩饰地释放恶意，放任其果如同病毒一样扩散，在无声无息之间侵入他人的人生，并留下漫长而难以愈合的伤痕时——有时候不得不提醒自己，与恶相对的善同样存在。如果这个世界上有一群人在毫不忌惮地传播恶果，那么也总有一群人在通过漫长的努力和坚持，一点点地追寻真相，维护自己心中的公平和正义——《聚焦》就是关于后者的一部电影。","type":"movie","artist":"","author":"","release_date":"2015","tab":"movie"},{"rank":2,"title":"The Accountant","image":"","rate":5,"notes":"呜呜呜呜呜好好看我爱大本","type":"movie","artist":"","author":"","release_date":"2016","tab":"movie"},{"rank":3,"title":"Blade Runner 2049","image":"","rate":5,"notes":"好长……","type":"movie","artist":"","author":"","release_date":"2017","tab":"movie"},{"rank":4,"title":"推拿","image":"","rate":5,"notes":"由衷地赞叹，拍得真好。让人没有关掉的念头。中间一度怀疑这个故事的基调是不是过于阴郁，是边缘人群适用的惯用手法吗。后来想起很关键的一点……他们不仅是盲人，还是社会底层的谋生者。这重身份让他们失去的不仅仅是健全人眼睛能看到的部分。","type":"movie","artist":"","author":"","release_date":"2014","tab":"movie"},{"rank":5,"title":"Green Book","image":"","rate":5,"notes":"\"You never win with violence. You only win when you maintain your dignity.\" 看到这里的时候真的有被震撼到。基调太好了，画面也是美的，让人坐在电影院里又哭又笑，看完之后心中保留着一点温暖，过一会才会散去。作为电影中规中矩，讲述的故事却要花很久很久才能让人真正明白。人的同理心实在难求，五分钟的动容已经难能可贵了","type":"movie","artist":"","author":"","release_date":"2018","tab":"movie"},{"rank":6,"title":"Arrival","image":"","rate":5,"notes":"“But to make yourself feel nothing, so as not to feel anything. What a waste” 想到了这个","type":"movie","artist":"","author":"","release_date":"2016","tab":"movie"},{"rank":7,"title":"Justice League: The Flashpoint Paradox","image":"","rate":5,"notes":"好看！！巴里真是一个小天使","type":"movie","artist":"","author":"","release_date":"2013","tab":"movie"},{"rank":8,"title":"Anatomy of a Fall","image":"","rate":5,"notes":"当一场意外变成一个必须接受陌生人审判的死亡案件时，当所有的隐私不得不暴露在太阳下被评价和剖析时，每一个微小的细节都显得如此庞大和割裂。看完结局我忍不住开始回想，这一切到底是怎么发生的。丈夫的死因理应是一个可怕的猜想，一个需要时间治愈的创伤，一场对过往生活的自省与反思，但因为法律的介入，最清楚事实的本人无法通过说出真相来洗清自己的嫌疑，女主角只能在第三人的审视和评价中，通过重复对痛苦回忆的叙述完成对丈夫自杀的和解。电影的每一分每一秒我都能感受到女主角复杂的痛苦，和无法阻止这场荒谬审判的无能为力。\n其中有一个桥段是，女主角通过录制视频来叙述自己与丈夫的过往，陈述夫妻关系的变化。这场叙述的目的是为了真实还原两人的关系，而当女主角说出自己真实的感受和想法时，却被律师暗示不要说对自己不利的证词，即使那些话语是事实的一部分。从这里开始我意识到，这场叙述的目的已经变了，变成了需要被无关的人审视甚至攻击的证词，她不应该说出自己的真实想法，她应该表演。但在这部电影中，我能真切地感受到，女主角在长达一年的庭审中，全程都没有选择那些失真的语言，相反，她一直在这种不熟悉的语言环境中真实地面对每一个质疑自己的人，面对自己的儿子，面对自己。我不得不为这种真实的美德落泪。\n当感情已经逐渐消逝，却不得不一个人回忆这场婚姻的开端，为了不让与这场感情无关的人进行错误的剖析，她选择吐露的字眼都要经过反复甄选。当丈夫刚去世的情况下，被迫回忆这段爱情的始末是否是一种巨大的痛苦，那些无关的人毫不关心，而女主角却不得不在乎这些无关的人如何评价他们的感情。我无法想象这是一种怎样的痛苦。\n事实是唯一的真相，但表达事实的方式却有很多种。在真实的生活里，每一个不可知的巧合都容易造成我们对事实的微小扭曲，人的感受、情绪、情感、记忆都可能影响我们对事实的表达，如公诉人律师所说，这些都是人主观的想法，每个人独特的视角和所经历的事件构建了我们每个人的主观事实。当不同主观事实发生冲突的时候，我们又该选择相信哪一个呢\n从电影的角度来讲，这部电影拥有极为精巧的视听技巧。Daniel站在审判席上听两方律师辩护时，镜头方位不停变换的那一幕，我真心实意地感受到了电影的魅力…\n我对人为制造的气氛和情绪是一个极为敏感的人，不过我相信钝感的人也能感受到这部电影通过人物对话、剧情节奏、叙事手法制造的紧张感，这是一种为了还原真实生活而制造的紧张感。其实观影途中还想到了好多值得发散的话题，比如法律的边界、第三视角和主体性的关系、婚姻责任和夫妻关系，之所以想到这么多，我感觉是因为它描述了真实的生活，足以说明这是一部多珍贵的电影。","type":"movie","artist":"","author":"","release_date":"2023","tab":"movie"},{"rank":9,"title":"烈日灼心","image":"","rate":4,"notes":"好好好好好好好好好看！","type":"movie","artist":"","author":"","release_date":"2015","tab":"movie"},{"rank":10,"title":"Grandma","image":"","rate":4,"notes":"喜欢","type":"movie","artist":"","author":"","release_date":"2015","tab":"movie"}],"music":[{"rank":1,"title":"I See The Light","image":"/recommendation-img/music-1.webp","rate":5,"notes":"Whenever I want to feel safe","type":"music","artist":"Mandy Moore, Zachary Levi","author":"","release_date":"","tab":"music"},{"rank":2,"title":"Snooze","image":"","rate":5,"notes":"Love it","type":"music","artist":"SZA","author":"","release_date":"","tab":"music"},{"rank":3,"title":"The Thrill is Gone","image":"","rate":5,"notes":"These are always the easiest, happiest four minutes of my day whenever I listen to this song","type":"music","artist":"RAYE","author":"","release_date":"","tab":"music"},{"rank":4,"title":"Worth i <script type="application/json" id="recommendationsTopDataCn">{"tv":[{"rank":1,"title":"宇宙小子","image":"/recommendation-img/tv-1.webp","rate":5,"notes":"My favorite show of all times...SU的剧情其实已经够硬核了，更硬核的是有时候在一些细节里，人物所表露出来的感情经常让我觉得重到心脏无法承受......比如S01E22里Steven意外得到时空机器，无数个未来的Steven都把事情搞砸了，并且全部都回到了自己拿到时空机器的前一刻，想要阻止当下的Steven拿到时空机器并据为己有。故事结局是某个来自未来的Steven毁掉了时空机器，无数个打作一团的Steven一个接一个陆续消失，那个未来的Steven对着当下手足无措的Steven说不用担心，现在不会有问题了，而当下的Steven含着眼泪特别drama地大喊“I don’t know what you’re talking about!” 而来自未来的Steven知道自己也快要消失了，于是上前亲了一下Steven的脸颊，就不见了。看到这里我不得不暂停一分钟......亲脸颊这个动作也太震撼了......如果了解Steven的人物设定，知道他是一个多可爱善良富有同理心的小男孩，大概就能理解这个举动的动机，但理解是一回事，亲眼目睹是另一回事......","type":"电视剧","artist":"","author":"","release_date":"2013","tab":"tv"},{"rank":2,"title":"心灵猎人","image":"","rate":5,"notes":"好久没看到如此喜欢的剧……人物塑造、剧情节奏、台词风格，每一个都完美契合我的观影偏好，尤其是情节推进方式，是由大量平铺直叙的人物对白将整个故事一层层堆叠起来的，每一个看似普通的对话场景里，都呈现出了符合当下社会情境的人物气氛，而在这个剧里，这一点纯粹是通过大量精巧的台词编排做到的（当然还有昏暗的色调hhh），例如探员在和连环杀手对话的时候，紧张，压抑，随着台词节奏的变化，虽然整个情节的节奏松弛有度，但紧张感一直在断断续续地累加，而在对话结束时，所有累积的紧张感一下子被释放，无法描述那一刻的我有多爽………更喜欢的是，这部剧有时候会让我联想到《聚焦》，同样是对一个事件或者某种知识领域进行系统化整理，这种像蜘蛛结网一样描述一个学科如何建立的过程也会让人看得很过瘾","type":"电视剧","artist":"","author":"","release_date":"2017","tab":"tv"},{"rank":3,"title":"布莱克书店","image":"","rate":5,"notes":"这个世界上怎么会有这么好玩的剧呢","type":"电视剧","artist":"","author":"","release_date":"2000","tab":"tv"},{"rank":4,"title":"万能管家","image":"","rate":5,"notes":"计划通管家和傻白甜少爷的日常，太喜欢了......没有任何恶趣味仅仅只是纯粹有趣的喜剧，也能做到让人忍不住大笑出声，太厉害了","type":"电视剧","artist":"","author":"","release_date":"1990","tab":"tv"},{"rank":5,"title":"权力的游戏","image":"","rate":5,"notes":"看书和看剧感受到的是不一样的震撼......从第一季看到最后一季，除了目睹人物命运的起伏，还能感受到青春期演员的成长对角色的影响，不仅让故事变得更真实了，还会让人更共情那些理应得到善报的人...而看小说的时候，会沉浸在故事本身，完全意想不到的情节发展和人物命运的交织真的让人沉迷......","type":"电视剧","artist":"","author":"","release_date":"2011","tab":"tv"},{"rank":6,"title":"万神殿","image":"","rate":5,"notes":"神才能创作出来的作品……","type":"电视剧","artist":"","author":"","release_date":"2022","tab":"tv"},{"rank":7,"title":"重启人生","image":"","rate":5,"notes":"人生的意义=和好朋友一起说没有意义的废话+释放善意+活在当下","type":"电视剧","artist":"","author":"","release_date":"2023","tab":"tv"},{"rank":8,"title":"真相捕捉","image":"","rate":5,"notes":"真的好看！！","type":"电视剧","artist":"","author":"","release_date":"2019","tab":"tv"},{"rank":9,"title":"羞耻","image":"","rate":5,"notes":"如果上学的时候能和Eva还有Noora做朋友，一定是很有趣的校园生活...","type":"电视剧","artist":"","author":"","release_date":"2015","tab":"tv"},{"rank":10,"title":"伦敦生活","image":"","rate":5,"notes":"just…amazing","type":"电视剧","artist":"","author":"","release_date":"2016","tab":"tv"}],"movie":[{"rank":1,"title":"聚焦","image":"/recommendation-img/movie-1.webp","rate":5,"notes":"有段时间看《聚焦》几乎成了我最喜欢的放松方式...即使成年后的日子大部分时间都迷失在琐碎平淡的日常里，但不可避免地，或许有时候是冷静地放任自己，去直面这个世界的暗面。当人类毫不掩饰地释放恶意，放任其果如同病毒一样扩散，在无声无息之间侵入他人的人生，并留下漫长而难以愈合的伤痕时——有时候不得不提醒自己，与恶相对的善同样存在。如果这个世界上有一群人在毫不忌惮地传播恶果，那么也总有一群人在通过漫长的努力和坚持，一点点地追寻真相，维护自己心中的公平和正义——《聚焦》就是关于后者的一部电影。","type":"电影","artist":"","author":"","release_date":"2015","tab":"movie"},{"rank":2,"title":"会计刺客","image":"","rate":5,"notes":"呜呜呜呜呜好好看我爱大本","type":"电影","artist":"","author":"","release_date":"2016","tab":"movie"},{"rank":3,"title":"银翼杀手2049","image":"","rate":5,"notes":"好长……","type":"电影","artist":"","author":"","release_date":"2017","tab":"movie"},{"rank":4,"title":"推拿","image":"","rate":5,"notes":"由衷地赞叹，拍得真好。让人没有关掉的念头。中间一度怀疑这个故事的基调是不是过于阴郁，是边缘人群适用的惯用手法吗。后来想起很关键的一点……他们不仅是盲人，还是社会底层的谋生者。这重身份让他们失去的不仅仅是健全人眼睛能看到的部分。","type":"电影","artist":"","author":"","release_date":"2014","tab":"movie"},{"rank":5,"title":"绿皮书","image":"","rate":5,"notes":"“You never win with violence. You only win when you maintain your dignity.” 看到这里的时候真的有被震撼到。基调太好了，画面也是美的，让人坐在电影院里又哭又笑，看完之后心中保留着一点温暖，过一会才会散去。作为电影中规中矩，讲述的故事却要花很久很久才能让人真正明白。人的同理心实在难求，五分钟的动容已经难能可贵了","type":"电影","artist":"","author":"","release_date":"2018","tab":"movie"},{"rank":6,"title":"降临","image":"","rate":5,"notes":"“But to make yourself feel nothing, so as not to feel anything. What a waste” 想到了这个","type":"电影","artist":"","author":"","release_date":"2016","tab":"movie"},{"rank":7,"title":"正义联盟：闪点悖论","image":"","rate":5,"notes":"好看！！巴里真是一个小天使","type":"电影","artist":"","author":"","release_date":"2013","tab":"movie"},{"rank":8,"title":"坠落的审判","image":"","rate":5,"notes":"当一场意外变成一个必须接受陌生人审判的死亡案件时，当所有的隐私不得不暴露在太阳下被评价和剖析时，每一个微小的细节都显得如此庞大和割裂。看完结局我忍不住开始回想，这一切到底是怎么发生的。丈夫的死因理应是一个可怕的猜想，一个需要时间治愈的创伤，一场对过往生活的自省与反思，但因为法律的介入，最清楚事实的本人无法通过说出真相来洗清自己的嫌疑，女主角只能在第三人的审视和评价中，通过重复对痛苦回忆的叙述完成对丈夫自杀的和解。电影的每一分每一秒我都能感受到女主角复杂的痛苦，和无法阻止这场荒谬审判的无能为力。\n其中有一个桥段是，女主角通过录制视频来叙述自己与丈夫的过往，陈述夫妻关系的变化。这场叙述的目的是为了真实还原两人的关系，而当女主角说出自己真实的感受和想法时，却被律师暗示不要说对自己不利的证词，即使那些话语是事实的一部分。从这里开始我意识到，这场叙述的目的已经变了，变成了需要被无关的人审视甚至攻击的证词，她不应该说出自己的真实想法，她应该表演。但在这部电影中，我能真切地感受到，女主角在长达一年的庭审中，全程都没有选择那些失真的语言，相反，她一直在这种不熟悉的语言环境中真实地面对每一个质疑自己的人，面对自己的儿子，面对自己。我不得不为这种真实的美德落泪。\n当感情已经逐渐消逝，却不得不一个人回忆这场婚姻的开端，为了不让与这场感情无关的人进行错误的剖析，她选择吐露的字眼都要经过反复甄选。当丈夫刚去世的情况下，被迫回忆这段爱情的始末是否是一种巨大的痛苦，那些无关的人毫不关心，而女主角却不得不在乎这些无关的人如何评价他们的感情。我无法想象这是一种怎样的痛苦。\n事实是唯一的真相，但表达事实的方式却有很多种。在真实的生活里，每一个不可知的巧合都容易造成我们对事实的微小扭曲，人的感受、情绪、情感、记忆都可能影响我们对事实的表达，如公诉人律师所说，这些都是人主观的想法，每个人独特的视角和所经历的事件构建了我们每个人的主观事实。当不同主观事实发生冲突的时候，我们又该选择相信哪一个呢\n从电影的角度来讲，这部电影拥有极为精巧的视听技巧。Daniel站在审判席上听两方律师辩护时，镜头方位不停变换的那一幕，我真心实意地感受到了电影的魅力…\n我对人为制造的气氛和情绪是一个极为敏感的人，不过我相信钝感的人也能感受到这部电影通过人物对话、剧情节奏、叙事手法制造的紧张感，这是一种为了还原真实生活而制造的紧张感。其实观影途中还想到了好多值得发散的话题，比如法律的边界、第三视角和主体性的关系、婚姻责任和夫妻关系，之所以想到这么多，我感觉是因为它描述了真实的生活，足以说明这是一部多珍贵的电影。","type":"电影","artist":"","author":"","release_date":"2023","tab":"movie"},{"rank":9,"title":"烈日灼心","image":"","rate":4,"notes":"好好好好好好好好好看！","type":"电影","artist":"","author":"","release_date":"2015","tab":"movie"},{"rank":10,"title":"与外婆同行","image":"","rate":4,"notes":"喜欢","type":"电影","artist":"","author":"","release_date":"2015","tab":"movie"}],"music":[{"rank":1,"title":"I See The Light","image":"/recommendation-img/music-1.webp","rate":5,"notes":"很难描述每次听这首歌时候的心情，很像是在一趟旅途中，知道自己即将前往一个一直想去的地方。或许是一种——充满了安全感的期待","type":"音乐","artist":"Mandy Moore, Zachary Levi","author":"","release_date":"","tab":"music"},{"rank":2,"title":"Snooze","image":"","rate":5,"notes":"好神奇的一首歌...完全听不腻","type":"音乐","artist":"SZA","author":"","rele "title":"昼颜：工作日下午3点的恋人们","titleAlt":"","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"或许是我的人生剧集了……高中的时候只看了前半段，当时的自己不觉得他们是为了禁忌和刺激的感觉而肤浅地出轨，而是「因为遇到了真爱」。 神奇的是，在重温前半段的时候，现在的我也有同样的感受，甚至会为了一点点恋爱的感觉而心动。但面对在婚姻中出轨的恋爱，比心动更快的是苦涩。 这份爱是真爱吗？深陷这段关系的他们到底有多少是为了爱而不断下陷的呢？如果为了追求禁忌和背德的刺激感更多的话，等他们能够堂堂正正地交往之后，等他们觉得安全之后，这种恋爱的感觉，是不是就会逐渐消散呢？ 这是一部非常特别的剧，或许直到现在，以后，我都会被这几个小时的内容一直影响着。","updated":"2020.06.29","release_date":"2014","artist":"","author":""},{"title":"隐秘的角落","titleAlt":"","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"遗憾蛮多的……五星全靠同行衬托","updated":"2020.06.26","release_date":"2020","artist":"","author":""},{"title":"L'amica geniale Season 1","titleAlt":"我的天才女友 第一季","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"别人眼里的天才，我的朋友","updated":"2020.03.27","release_date":"2018","artist":"","author":""},{"title":"Fleabag Season 1","titleAlt":"伦敦生活 第一季","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"just…amazing","updated":"2019.10.26","release_date":"2016","artist":"","author":""},{"title":"Fleabag Season 2","titleAlt":"伦敦生活 第二季","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"🎵心痛比想念更真实","updated":"2019.10.26","release_date":"2019","artist":"","author":""},{"title":"Game of Thrones Season 1","titleAlt":"权力的游戏 第一季","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"看书和看剧感受到的是不一样的震撼......从第一季看到最后一季，除了目睹人物命运的起伏，还能感受到青春期演员的成长对角色的影响，不仅让故事变得更真实了，还会让人更共情那些理应得到善报的人...而看小说的时候，会沉浸在故事本身，完全意想不到的情节发展和人物命运的交织真的让人沉迷......","updated":"2019.05.03","release_date":"2011","artist":"","author":""},{"title":"Game of Thrones Season 2","titleAlt":"权力的游戏 第二季","type":"tv series","layout":"recommendation-tv-series","tab":"tv","rate":5,"notes":"","updated":"2019.05.03","release_date":"2012","artist":"","author":""},{"title":"Game of Thrones Season 3","titleAlt":"权力的游戏 第三季","type":"tv series","layout":"recommen 得不暴露在太阳下被评价和剖析时，每一个微小的细节都显得如此庞大和割裂。看完结局我忍不住开始回想，这一切到底是怎么发生的。丈夫的死因理应是一个可怕的猜想，一个需要时间治愈的创伤，一场对过往生活的自省与反思，但因为法律的介入，最清楚事实的本人无法通过说出真相来洗清自己的嫌疑，女主角只能在第三人的审视和评价中，通过重复对痛苦回忆的叙述完成对丈夫自杀的和解。电影的每一分每一秒我都能感受到女主角复杂的痛苦，和无法阻止这场荒谬审判的无能为力。\n其中有一个桥段是，女主角通过录制视频来叙述自己与丈夫的过往，陈述夫妻关系的变化。这场叙述的目的是为了真实还原两人的关系，而当女主角说出自己真实的感受和想法时，却被律师暗示不要说对自己不利的证词，即使那些话语是事实的一部分。从这里开始我意识到，这场叙述的目的已经变了，变成了需要被无关的人审视甚至攻击的证词，她不应该说出自己的真实想法，她应该表演。但在这部电影中，我能真切地感受到，女主角在长达一年的庭审中，全程都没有选择那些失真的语言，相反，她一直在这种不熟悉的语言环境中真实地面对每一个质疑自己的人，面对自己的儿子，面对自己。我不得不为这种真实的美德落泪。\n当感情已经逐渐消逝，却不得不一个人回忆这场婚姻的开端，为了不让与这场感情无关的人进行错误的剖析，她选择吐露的字眼都要经过反复甄选。当丈夫刚去世的情况下，被迫回忆这段爱情的始末是否是一种巨大的痛苦，那些无关的人毫不关心，而女主角却不得不在乎这些无关的人如何评价他们的感情。我无法想象这是一种怎样的痛苦。\n事实是唯一的真相，但表达事实的方式却有很多种。在真实的生活里，每一个不可知的巧合都容易造成我们对事实的微小扭曲，人的感受、情绪、情感、记忆都可能影响我们对事实的表达，如公诉人律师所说，这些都是人主观的想法，每个人独特的视角和所经历的事件构建了我们每个人的主观事实。当不同主观事实发生冲突的时候，我们又该选择相信哪一个呢\n从电影的角度来讲，这部电影拥有极为精巧的视听技巧。Daniel站在审判席上听两方律师辩护时，镜头方位不停变换的那一幕，我真心实意地感受到了电影的魅力…\n我对人为制造的气氛和情绪是一个极为敏感的人，不过我相信钝感的人也能感受到这部电影通过人物对话、剧情节奏、叙事手法制造的紧张感，这是一种为了还原真实生活而制造的紧张感。其实观影途中还想到了好多值得发散的话题，比如法律的边界、第三视角和主体性的关系、婚姻责任和夫妻关系，之所以想到这么多，我感觉是因为它描述了真实的生活，足以说明这是一部多珍贵的电影。","updated":"2024.01.29","release_date":"2023","artist":"","author":""},{"title":"May December","titleAlt":"五月十二月","type":"movie","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"好平淡的故事…但有一种莫名其妙的吸引力","updated":"2024.01.27","release_date":"2023","artist":"","author":""},{"title":"DogMan","titleAlt":"狗神","type":"movie","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"总感觉每次刚要开始深思的时候剧情就推进到了下一个阶段……整体是好看的","updated":"2024.01.26","release_date":"2023","artist":"","author":""},{"title":"Saltburn","titleAlt":"萨特本","type":"movie","layout":"recommendation-movie","tab":"movie","rate":3,"notes":"好喜欢摄影和色彩，其他的只能说……………………这很难评","updated":"2024.01.22","release_date":"2023","artist":"","author":""},{"title":"Red, White & Royal Blue","titleAlt":"星条红与皇室蓝","type":"movie","layout":"recommendation-movie","tab":"movie","rate":2,"notes":"","updated":"2024.01.09","release_date":"2023","artist":"","author":""},{"title":"T 的证词，她不应该说出自己的真实想法，她应该表演。但在这部电影中，我能真切地感受到，女主角在长达一年的庭审中，全程都没有选择那些失真的语言，相反，她一直在这种不熟悉的语言环境中真实地面对每一个质疑自己的人，面对自己的儿子，面对自己。我不得不为这种真实的美德落泪。\n当感情已经逐渐消逝，却不得不一个人回忆这场婚姻的开端，为了不让与这场感情无关的人进行错误的剖析，她选择吐露的字眼都要经过反复甄选。当丈夫刚去世的情况下，被迫回忆这段爱情的始末是否是一种巨大的痛苦，那些无关的人毫不关心，而女主角却不得不在乎这些无关的人如何评价他们的感情。我无法想象这是一种怎样的痛苦。\n事实是唯一的真相，但表达事实的方式却有很多种。在真实的生活里，每一个不可知的巧合都容易造成我们对事实的微小扭曲，人的感受、情绪、情感、记忆都可能影响我们对事实的表达，如公诉人律师所说，这些都是人主观的想法，每个人独特的视角和所经历的事件构建了我们每个人的主观事实。当不同主观事实发生冲突的时候，我们又该选择相信哪一个呢\n从电影的角度来讲，这部电影拥有极为精巧的视听技巧。Daniel站在审判席上听两方律师辩护时，镜头方位不停变换的那一幕，我真心实意地感受到了电影的魅力…\n我对人为制造的气氛和情绪是一个极为敏感的人，不过我相信钝感的人也能感受到这部电影通过人物对话、剧情节奏、叙事手法制造的紧张感，这是一种为了还原真实生活而制造的紧张感。其实观影途中还想到了好多值得发散的话题，比如法律的边界、第三视角和主体性的关系、婚姻责任和夫妻关系，之所以想到这么多，我感觉是因为它描述了真实的生活，足以说明这是一部多珍贵的电影。","updated":"2024.01.29","release_date":"2023","artist":"","author":""},{"title":"五月十二月","titleAlt":"May December","type":"电影","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"好平淡的故事…但有一种莫名其妙的吸引力","updated":"2024.01.27","release_date":"2023","artist":"","author":""},{"title":"狗神","titleAlt":"DogMan","type":"电影","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"总感觉每次刚要开始深思的时候剧情就推进到了下一个阶段……整体是好看的","updated":"2024.01.26","release_date":"2023","artist":"","author":""},{"title":"萨特本","titleAlt":"Saltburn","type":"电影","layout":"recommendation-movie","tab":"movie","rate":3,"notes":"好喜欢摄影和色彩，其他的只能说……………………这很难评","updated":"2024.01.22","release_date":"2023","artist":"","author":""},{"title":"星条红与皇室蓝","titleAlt":"Red, White & Royal Blue","type":"电影","layout":"recommendation-movie","tab":"movie","rate":2,"notes":"","updated":"2024.01.09","release_date":"2023","artist":"","author":""},{"title":"八恶人","titleAlt":"The Hateful Eight","type":"电影","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"","updated":"2023.12.31","release_date":"2015","artist":"","author":""},{"title":"无耻混蛋","titleAlt":"Inglourious Basterds","type":"电影","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"","updated":"2023.12.30","release_date":"2009","artist":"","author":""} :"recommendation-movie","tab":"movie","rate":5,"notes":"好看！（另外看的时候一直觉得女主眼熟，原来是银翼杀手里的那个！啊啊啊好爱","updated":"2019.12.16","release_date":"2019","artist":"","author":""},{"title":"82年生的金智英","titleAlt":"","type":"电影","layout":"recommendation-movie","tab":"movie","rate":5,"notes":"断断续续看金智英的这段时间里，生活中发生了蛮多事。总而言之当脑袋里想的和眼睛看见的差距太大就很容易出问题。其实第一次萌发想出柜的念头是因为几年前，一个很要好的女生朋友谈恋爱了，她和我谈起这件事，提到她和她妈妈之前讨论过喜欢的男生类型，和现在的男朋友完全不一样。当时听到这里又惊奇又难过，才知道原来有些母女是可以讨论这些的吗，为什么我不可以呢……为什么当我妈谈起这种事我只能小心翼翼地转移话题，为什么我不可以拥有和她一样的东西呢。痛苦过后才醒悟，这样横向比较是不会快乐的。但金智英好像一个始终悬在头顶上的问号，不断追问，为什么呢。虽然看的过程中一直在哭，但哭得最厉害的时候是当我看完之后，抬头看到周围在说话的，在笑着的，健康的有生命力的女孩子，忍不住想为什么金智英不能拥有这一切呢","updated":"2019.12.15","release_date":"2019","artist":"","author":""},{"title":"没有宇宙我们无法生存","titleAlt":"","type":"电影","layout":"recommendation-movie","tab":"movie","rate":5,"notes":"“没有你的宇宙我无法生存”","updated":"2019.12.01","release_date":"2014","artist":"","author":""},{"title":"冰雪奇缘2","titleAlt":"Frozen II","type":"电影","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"根本就是爱情故事！！（大声嘶吼","updated":"2019.11.30","release_date":"2019","artist":"","author":""},{"title":"新宿男孩","titleAlt":"Shinjuku Boys","type":"电影","layout":"recommendation-movie","tab":"movie","rate":5,"notes":"真诚和温暖","updated":"2019.11.27","release_date":"1996","artist":"","author":""},{"title":"黑衣人：全球追缉","titleAlt":"Men in Black International","type":"电影","layout":"recommendation-movie","tab":"movie","rate":2,"notes":"Tessa的颜值都撑不起这样空洞的剧本","updated":"2019.06.29","release_date":"2019","artist":"","author":""},{"title":"花与爱丽丝杀人事件","titleAlt":"","type":"电影","layout":"recommendation-movie","tab":"movie","rate":4,"notes":"好看……但是有种被骗的感觉啊啊啊啊啊","updated":"2019.06.06","release_date":"2015","artist":"","author":""},{"title":"复仇者联盟4：终局之战","titleAlt":"Avengers: Endgame","type":"电影","layout":"recommendation-movie","tab":"movie","rate":5,"notes":"Hail hydra","updated":"2019.05.09","release_date":"2019","artist":"","author":""},{"title":"雷霆沙赞！","titleAlt":"Shazam!","type":"电影","layout":"recommendation-movi <div class="recommendations-page-wrap" id="recommendationsPage">
  <div class="rec-board" id="recBoard">
    <div class="rec-board-tabs" role="tablist" aria-label="Recommendation categories">
      <button type="button" class="rec-board-tab is-active" role="tab" aria-selected="true" data-tab="tv" data-i18n="recommendations_page.tabs.tv">
        <span class="i18n-text">剧集</span>
      </button>
      <button type="button" class="rec-board-tab" role="tab" aria-selected="false" data-tab="movie" data-i18n="recommendations_page.tabs.movie">
        <span class="i18n-text">电影</span>
      </button>
      <button type="button" class="rec-board-tab" role="tab" aria-selected="false" data-tab="music" data-i18n="recommendations_page.tabs.music">
        <span class="i18n-text">音乐</span>
      </button>
      <button type="button" class="rec-board-tab" role="tab" aria-selected="false" data-tab="musical" data-i18n="recommendations_page.tabs.musical">
        <span class="i18n-text">音乐剧</span>
      </button>
      <button type="button" class="rec-board-tab" role="tab" aria-selected="false" data-tab="book" data-i18n="recommendations_page.tabs.book">
        <span class="i18n-text">书籍</span>
      </button>
    </div>

    <div class="rec-board-body" id="recBoardBody">
      <!-- Filled by JS -->
    </div>
  </div>

  <section class="rec-recent" id="recRecent">
    <h2 class="rec-recent-title">
      <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
      <span class="i18n-text" data-i18n="recommendations_page.recent_title">近期观看</span>
    </h2>
    <div class="rec-recent-grid" id="recRecentGrid">
      <!-- Filled by JS -->
    </div>
  </section>
</div>

<script>
(function () {
  function getLang() {
    if (window.__getLang) return window.__getLang();
    var lang = document.documentElement.getAttribute('lang');
    return lang === 'zh-CN' ? 'zh-CN' : 'en';
  }

  function getStrings() {
    return (window.__i18n && window.__i18n[getLang()]) || (window.__i18n && window.__i18n.en) || {};
  }

  function t(key, fallback) {
    var strings = getStrings();
    return strings[key] != null ? strings[key] : fallback;
  }

  function parseJson(el, fallback) {
    if (!el) return fallback;
    try {
      var data = JSON.parse(el.textContent || '');
      return data == null ? fallback : data;
    } catch (e) {
      return fallback;
    }
  }

  function getTopData() {
    var en = parseJson(document.getElementById('recommendationsTopDataEn'), {});
    var cn = parseJson(document.getElementById('recommendationsTopDataCn'), {});
    return getLang() === 'zh-CN' ? cn : en;
  }

  function getNo1Covers() {
    return parseJson(document.getElementById('recommendationsNo1Covers'), {}) || {};
  }

  function getRecentData() {
    var en = parseJson(document.getElementById('recommendationsRecentDataEn'), {});
    var cn = parseJson(document.getElementById('recommendationsRecentDataCn'), {});
    return getLang() === 'zh-CN' ? cn : en;
  }

  function starsHtml(rate) {
    var n = parseInt(rate, 10);
    if (isNaN(n)) n = 0;
    if (n < 0) n = 0;
    if (n > 5) n = 5;
    var html = '<span class="recommendation-rate rec-board-stars" aria-label="' + n + ' / 5">';
    for (var s = 1; s <= 5; s++) {
      html += '<i class="fa-solid fa-star ' + (s <= n ? 'is-on' : 'is-off') + '" aria-hidden="true"></i>';
    }
    html += '</span>';
    return html;
  }

  function badgeClassFromLayout(layout) {
    return 'recommendation-badge recommendation-badge--' + String(layout || '').replace('recommendation-', '');
  }

  var RECENT_PAGE_SIZE = 4;
  var recentPageByTab = {};
  var recentSearchByTab = {};

  function normalizeRecentSearch(q) {
    return String(q || '').trim().toLowerCase();
  }

  function recentItemMatches(it, query) {
    if (!query) return true;
    var hay = [
      it && it.title,
      it && it.titleAlt,
      it && it.author,
      it && it.artist,
      it && it.notes
    ].join(' ').toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function filterRecentItems(items, tabKey) {
    var query = normalizeRecentSearch(recentSearchByTab[tabKey]);
    if (!query) return items.slice();
    return items.filter(function (it) {
      return recentItemMatches(it, query);
    });
  }

  function recentSearchPlaceholder(tabKey) {
    if (tabKey === 'music') {
      return t(
        'recommendations_page.recent_search_placeholder_music',
        'Search title, artist, or notes'
      );
    }
    if (tabKey === 'book') {
      return t(
        'recommendations_page.recent_search_placeholder_book',
        'Search title, author, or notes'
      );
    }
    return t(
      'recommendations_page.recent_search_placeholder_title_notes',
      'Search title or notes'
    );
  }

  function recentSearchHtml(tabKey) {
    var value = recentSearchByTab[tabKey] || '';
    var placeholder = recentSearchPlaceholder(tabKey);
    return (
      '<label class="rec-recent-search">' +
        '<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>' +
        '<input type="search" class="rec-recent-search-input" data-recent-search="' + escapeHtml(tabKey) + '"' +
          ' value="' + escapeHtml(value) + '"' +
          ' placeholder="' + escapeHtml(placeholder) + '"' +
          ' autocomplete="off" spellcheck="false">' +
      '</label>'
    );
  }

  function recentItemHtml(it, tabKey) {
    var titleHtml = (tabKey === 'tv' || tabKey === 'movie')
      ? titleWithReleaseHtml(it)
      : escapeHtml(it.title || '');
    var fullTitle = (it && it.title) ? String(it.title) : '';
    var topClass = 'rec-recent-item-top';
    if (tabKey === 'music' || tabKey === 'book') topClass += ' has-side-meta';
    return (
      '<div class="rec-recent-item">' +
        '<div class="' + topClass + '">' +
          '<div class="rec-recent-item-heading">' +
            '<span class="' + badgeClassFromLayout(it.layout) + '">' + escapeHtml(it.type || '') + '</span>' +
            '<span class="rec-recent-item-title" data-full-title="' + escapeHtml(fullTitle) + '">' + titleHtml + '</span>' +
          '</div>' +
          sideMetaHtml(it, tabKey) +
        '</div>' +
        '<div class="rec-recent-item-meta">' +
          starsHtml(it.rate) +
          '<span class="rec-recent-item-date">' + escapeHtml(it.updated || '') + '</span>' +
        '</div>' +
        (it.notes
          ? notesClampHtml(it.notes, 2, 'rec-recent-item-notes')
          : '<p class="rec-recent-item-notes-empty">' +
              escapeHtml(t('recommendations_page.no_notes', 'No notes yet.')) +
            '</p>') +
      '</div>'
    );
  }

  function recentPaginationHtml(tabKey, pageIndex, totalPages) {
    if (totalPages <= 1) return '';
    var prevDisabled = pageIndex <= 0;
    var nextDisabled = pageIndex >= totalPages - 1;
    var pageInfo = t('recommendations_page.page_info', '{current} / {total}')
      .replace('{current}', String(pageIndex + 1))
      .replace('{total}', String(totalPages));
    return (
      '<div class="rec-recent-pagination" data-recent-tab="' + escapeHtml(tabKey) + '">' +
        '<button type="button" class="rec-recent-page-btn rec-recent-page-btn--text" data-recent-page="first"' +
          (prevDisabled ? ' disabled aria-disabled="true"' : '') +
          ' aria-label="' + escapeHtml(t('recommendations_page.first_page', 'First')) + '">' +
          escapeHtml(t('recommendations_page.first_page', 'First')) +
        '</button>' +
        '<button type="button" class="rec-recent-page-btn" data-recent-page="prev"' +
          (prevDisabled ? ' disabled aria-disabled="true"' : '') +
          ' aria-label="' + escapeHtml(t('recommendations_page.prev_page', 'Previous')) + '">' +
          '<i class="fa-solid fa-chevron-left" aria-hidden="true"></i>' +
        '</button>' +
        '<span class="rec-recent-page-info">' + escapeHtml(pageInfo) + '</span>' +
        '<button type="button" class="rec-recent-page-btn" data-recent-page="next"' +
          (nextDisabled ? ' disabled aria-disabled="true"' : '') +
          ' aria-label="' + escapeHtml(t('recommendations_page.next_page', 'Next')) + '">' +
          '<i class="fa-solid fa-chevron-right" aria-hidden="true"></i>' +
        '</button>' +
        '<button type="button" class="rec-recent-page-btn rec-recent-page-btn--text" data-recent-page="last"' +
          (nextDisabled ? ' disabled aria-disabled="true"' : '') +
          ' aria-label="' + escapeHtml(t('recommendations_page.last_page', 'Last')) + '">' +
          escapeHtml(t('recommendations_page.last_page', 'Last')) +
        '</button>' +
      '</div>'
    );
  }

  function buildRecentCardBodyHtml(tabKey) {
    var data = getRecentData() || {};
    var allItems = Array.isArray(data[tabKey]) ? data[tabKey] : [];
    var items = filterRecentItems(allItems, tabKey);
    var query = normalizeRecentSearch(recentSearchByTab[tabKey]);
    var totalPages = Math.max(1, Math.ceil(items.length / RECENT_PAGE_SIZE) || 1);
    if (!items.length) totalPages = 1;
    var pageIndex = recentPageByTab[tabKey] || 0;
    if (pageIndex < 0) pageIndex = 0;
    if (pageIndex > totalPages - 1) pageIndex = totalPages - 1;
    recentPageByTab[tabKey] = pageIndex;

    var pageItems = items.slice(
      pageIndex * RECENT_PAGE_SIZE,
      pageIndex * RECENT_PAGE_SIZE + RECENT_PAGE_SIZE
    );
    var rows = pageItems.map(function (it) {
      return recentItemHtml(it, tabKey);
    }).join('');
    var pager = recentPaginationHtml(tabKey, pageIndex, items.length > RECENT_PAGE_SIZE ? totalPages : 1);
    var emptyMsg = query
      ? t('recommendations_page.recent_search_empty', 'No matching results.')
      : t('recommendations_page.recent_empty', 'Nothing here yet.');
    var emptyKey = query
      ? 'recommendations_page.recent_search_empty'
      : 'recommendations_page.recent_empty';
    if (rows) return '<div class="rec-recent-items">' + rows + '</div>' + pager;
    return (
      '<p class="rec-recent-empty i18n-text" data-i18n="' + emptyKey + '">' +
        escapeHtml(emptyMsg) +
      '</p>'
    );
  }

  function renderRecentCardBody(tabKey) {
    var card = document.querySelector('.rec-recent-card[data-recent-card="' + tabKey + '"]');
    if (!card) return;
    var body = card.querySelector('.rec-recent-card-body');
    if (!body) return;
    body.innerHTML = buildRecentCardBodyHtml(tabKey);
    requestAnimationFrame(function () {
      initNotesClamps(body);
      markRecentExpandable(body);
    });
  }

  function renderRecentSection() {
    var grid = document.getElementById('recRecentGrid');
    if (!grid) return;
    var tabs = [
      { key: 'tv', labelKey: 'recommendations_page.tabs.tv', fallback: 'TV Series' },
      { key: 'movie', labelKey: 'recommendations_page.tabs.movie', fallback: 'Movies' },
      { key: 'music', labelKey: 'recommendations_page.tabs.music', fallback: 'Music' },
      { key: 'book', labelKey: 'recommendations_page.tabs.book', fallback: 'Books' }
    ];

    grid.innerHTML = tabs.map(function (tab) {
      var label = t(tab.labelKey, tab.fallback);
      return (
        '<article class="rec-recent-card" data-recent-card="' + escapeHtml(tab.key) + '">' +
          '<div class="rec-recent-card-head">' +
            '<h3 class="rec-recent-card-title">' +
              '<i class="' + placeholderIcon(tab.key) + '" aria-hidden="true"></i> ' +
              '<span class="i18n-text" data-i18n="' + tab.labelKey + '">' + escapeHtml(label) + '</span>' +
            '</h3>' +
            recentSearchHtml(tab.key) +
          '</div>' +
          '<div class="rec-recent-card-body">' + buildRecentCardBodyHtml(tab.key) + '</div>' +
        '</article>'
      );
    }).join('');

    requestAnimationFrame(function () {
      initNotesClamps(grid);
      markRecentExpandable(grid);
    });
  }

  function topForTab(tab) {
    var data = getTopData() || {};
    var list = Array.isArray(data[tab]) ? data[tab].slice() : [];
    list.sort(function (a, b) { return (a.rank || 0) - (b.rank || 0); });
    return list;
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function titleWithReleaseHtml(item) {
    var html = escapeHtml(item && item.title);
    var rd = item && item.release_date;
    if (rd !== undefined && rd !== null && String(rd).trim() !== '') {
      html += '&nbsp;&nbsp;<span class="rec-board-release">(' + escapeHtml(String(rd).trim()) + ')</span>';
    }
    return html;
  }

  function sideMetaHtml(item, tab) {
    if (tab === 'music') {
      var artist = item && item.artist ? String(item.artist).trim() : '';
      if (!artist) return '';
      return '<span class="rec-board-artist">' + escapeHtml(artist) + '</span>';
    }
    if (tab === 'book') {
      var author = item && item.author ? String(item.author).trim() : '';
      if (!author) return '';
      return '<span class="rec-board-author">' + escapeHtml(author) + '</span>';
    }
    return '';
  }

  function notesClampHtml(notes, maxLines, extraClass) {
    var text = notes || '';
    var moreLabel = t('recommendations_page.more', 'More');
    var lessLabel = t('recommendations_page.collapse', 'Collapse');
    return (
      '<div class="rec-notes-clamp' + (extraClass ? ' ' + extraClass : '') + '" data-lines="' + maxLines + '" data-full="' + escapeHtml(text) + '">' +
        '<div class="rec-notes-clamp-body">' +
          '<span class="rec-notes-clamp-text"></span>' +
          '<span class="rec-notes-clamp-ellipsis" hidden>......</span>' +
          '<button type="button" class="rec-notes-clamp-more i18n-text" data-i18n="recommendations_page.more" hidden>' +
            escapeHtml(moreLabel) +
          '</button>' +
        '</div>' +
        '<button type="button" class="rec-notes-clamp-less i18n-text" data-i18n="recommendations_page.collapse" hidden>' +
          escapeHtml(lessLabel) +
        '</button>' +
      '</div>'
    );
  }

  function getLineHeight(el) {
    var cs = window.getComputedStyle(el);
    var lh = cs.lineHeight;
    if (!lh || lh === 'normal') return parseFloat(cs.fontSize) * 1.5;
    var n = parseFloat(lh);
    return isNaN(n) ? parseFloat(cs.fontSize) * 1.5 : n;
  }

  function exceedsLines(el, lines) {
    if (!el) return false;
    return el.scrollHeight > getLineHeight(el) * lines + 1;
  }

  function fitNotesClamp(root) {
    if (!root) return;
    var full = root.getAttribute('data-full') || '';
    var maxLines = parseInt(root.getAttribute('data-lines'), 10) || 2;
    var textEl = root.querySelector('.rec-notes-clamp-text');
    var ellipsis = root.querySelector('.rec-notes-clamp-ellipsis');
    var moreBtn = root.querySelector('.rec-notes-clamp-more');
    var lessBtn = root.querySelector('.rec-notes-clamp-less');
    var body = root.querySelector('.rec-notes-clamp-body');
    if (!textEl || !body) return;

    root.classList.remove('is-expanded', 'is-short', 'is-clamped');
    textEl.textContent = full;
    if (ellipsis) ellipsis.hidden = true;
    if (moreBtn) moreBtn.hidden = true;
    if (lessBtn) lessBtn.hidden = true;

    if (!full || !exceedsLines(body, maxLines)) {
      root.classList.add('is-short');
      return;
    }

    if (ellipsis) ellipsis.hidden = false;
    if (moreBtn) moreBtn.hidden = false;

    var lo = 0;
    var hi = full.length;
    var best = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      textEl.textContent = full.slice(0, mid).replace(/\s+$/, '');
      if (!exceedsLines(body, maxLines)) {
        best = mid;
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }

    textEl.textContent = full.slice(0, best).replace(/\s+$/, '');
    root.classList.add('is-clamped');
  }

  function expandNotesClamp(root) {
    if (!root || root.classList.contains('is-short')) return;
    var full = root.getAttribute('data-full') || '';
    var textEl = root.querySelector('.rec-notes-clamp-text');
    var ellipsis = root.querySelector('.rec-notes-clamp-ellipsis');
    var moreBtn = root.querySelector('.rec-notes-clamp-more');
    var lessBtn = root.querySelector('.rec-notes-clamp-less');
    if (textEl) textEl.textContent = full;
    if (ellipsis) ellipsis.hidden = true;
    if (moreBtn) moreBtn.hidden = true;
    if (lessBtn) lessBtn.hidden = false;
    root.classList.add('is-expanded');
    root.classList.remove('is-clamped');
  }

  function collapseNotesClamp(root) {
    if (!root) return;
    root.classList.remove('is-expanded');
    fitNotesClamp(root);
  }

  function initNotesClamps(scope) {
    var roots = (scope || document).querySelectorAll('.rec-notes-clamp');
    for (var i = 0; i < roots.length; i++) fitNotesClamp(roots[i]);
  }

  function isMobileRecentLayout() {
    return window.matchMedia && window.matchMedia('(max-width: 640px)').matches;
  }

  function isHorizontallyTruncated(el) {
    if (!el) return false;
    return el.scrollWidth > el.clientWidth + 1;
  }

  function markRecentExpandable(scope) {
    var items = (scope || document).querySelectorAll('.rec-recent-item');
    var tip = t('recommendations_page.recent_expand_hint', 'Click to view full info');
    var desktop = !(window.matchMedia && window.matchMedia('(max-width: 640px)').matches);
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      item.classList.remove('is-meta-expandable');
      item.removeAttribute('title');
      if (item.classList.contains('is-meta-expanded')) {
        item.classList.add('is-meta-expandable');
        continue;
      }
      var titleEl = item.querySelector('.rec-recent-item-title');
      var sideEl = item.querySelector('.rec-board-artist, .rec-board-author');
      if (isHorizontallyTruncated(titleEl) || isHorizontallyTruncated(sideEl)) {
        item.classList.add('is-meta-expandable');
        if (desktop) item.setAttribute('title', tip);
      }
    }
  }

  function toggleRecentItemMeta(item) {
    if (!item) return;
    var wasExpanded = item.classList.contains('is-meta-expanded');
    var card = item.closest('.rec-recent-card');
    if (card) {
      var expanded = card.querySelectorAll('.rec-recent-item.is-meta-expanded');
      for (var i = 0; i < expanded.length; i++) {
        expanded[i].classList.remove('is-meta-expanded', 'is-meta-stacked');
      }
    }
    if (wasExpanded) {
      markRecentExpandable(card || item.parentNode);
      return;
    }

    if (!item.classList.contains('is-meta-expandable')) return;

    var titleEl = item.querySelector('.rec-recent-item-title');
    var sideEl = item.querySelector('.rec-board-artist, .rec-board-author');
    var titleTrunc = isHorizontallyTruncated(titleEl);
    var sideTrunc = isHorizontallyTruncated(sideEl);
    // Already fully visible on one line — no layout change
    if (!titleTrunc && !sideTrunc) return;

    item.classList.add('is-meta-expanded');
    item.removeAttribute('title');
    requestAnimationFrame(function () {
      var top = item.querySelector('.rec-recent-item-top');
      var heading = item.querySelector('.rec-recent-item-heading');
      if (!top || !heading || !sideEl || !titleEl) {
        markRecentExpandable(card || item.parentNode);
        return;
      }
      item.classList.remove('is-meta-stacked');
      var gap = parseFloat(window.getComputedStyle(top).columnGap || window.getComputedStyle(top).gap) || 10;
      var prevTitleWs = titleEl.style.whiteSpace;
      var prevSideWs = sideEl.style.whiteSpace;
      var prevSideMax = sideEl.style.maxWidth;
      titleEl.style.whiteSpace = 'nowrap';
      sideEl.style.whiteSpace = 'nowrap';
      sideEl.style.maxWidth = 'none';
      var need = heading.scrollWidth + sideEl.scrollWidth + gap;
      titleEl.style.whiteSpace = prevTitleWs;
      sideEl.style.whiteSpace = prevSideWs;
      sideEl.style.maxWidth = prevSideMax;
      if (need > top.clientWidth + 1) item.classList.add('is-meta-stacked');
      markRecentExpandable(card || item.parentNode);
    });
  }

  function placeholderIcon(tab) {
    if (tab === 'book') return 'fa-solid fa-book';
    if (tab === 'musical') return 'fa-solid fa-masks-theater';
    if (tab === 'music') return 'fa-solid fa-music';
    if (tab === 'tv') return 'fa-solid fa-tv';
    return 'fa-solid fa-film';
  }

  var LIST_PAGE_SIZE = 4;
  var listPageByTab = {};

  function buildListRowsHtml(pageItems, tab) {
    return pageItems.map(function (it) {
      var rank = it.rank != null ? it.rank : '';
      return (
        '<div class="rec-board-row">' +
          '<span class="rec-board-rank" aria-label="#' + rank + '">' + rank + '</span>' +
          '<div class="rec-board-row-main">' +
            '<div class="rec-board-row-top">' +
              '<span class="rec-board-row-title">' + titleWithReleaseHtml(it) + '</span>' +
              sideMetaHtml(it, tab) +
            '</div>' +
            (it.notes
              ? notesClampHtml(it.notes, 2, 'rec-board-row-notes')
              : '') +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function getListPageItems(rest, pageIndex) {
    if (pageIndex <= 0) return rest.slice(0, LIST_PAGE_SIZE);
    return rest.slice(LIST_PAGE_SIZE);
  }

  function getListTotalPages(rest) {
    if (!rest.length) return 1;
    return rest.length > LIST_PAGE_SIZE ? 2 : 1;
  }

  function renderBoard(tab, page) {
    var body = document.getElementById('recBoardBody');
    if (!body) return;
    var items = topForTab(tab);
    if (!items.length) {
      body.innerHTML =
        '<div class="rec-board-empty">' +
          '<i class="fa-regular fa-face-meh" aria-hidden="true"></i>' +
          '<p class="i18n-text" data-i18n="recommendations_page.empty">' +
            escapeHtml(t('recommendations_page.empty', 'No recommendations in this category yet.')) +
          '</p>' +
        '</div>';
      return;
    }

    var first = items[0];
    var rest = items.slice(1);
    var totalPages = getListTotalPages(rest);
    var pageIndex = typeof page === 'number' ? page : (listPageByTab[tab] || 0);
    if (pageIndex < 0) pageIndex = 0;
    if (pageIndex > totalPages - 1) pageIndex = totalPages - 1;
    listPageByTab[tab] = pageIndex;

    var pageItems = getListPageItems(rest, pageIndex);
    var coverSrc = first.image || (getNo1Covers() || {})[tab] || '';
    var coverHtml = coverSrc
      ? '<img src="' + escapeHtml(coverSrc) + '" alt="' + escapeHtml(first.title) + '" loading="lazy">'
      : '<div class="rec-board-cover-placeholder"><i class="' + placeholderIcon(tab) + '" aria-hidden="true"></i></div>';

    var labelHtml =
      '<div class="rec-board-featured-label">' +
        '<i class="fa-solid fa-crown" aria-hidden="true"></i> ' +
        '<span class="i18n-text" data-i18n="recommendations_page.no1">' +
          escapeHtml(t('recommendations_page.no1', 'My No.1 Pick')) +
        '</span>' +
      '</div>';

    var featuredMain =
      '<div class="rec-board-featured-main">' +
        '<div class="rec-board-cover">' + coverHtml + '</div>' +
        '<div class="rec-board-featured-info">' +
          '<div class="rec-board-featured-entry">' +
            '<span class="rec-board-rank" aria-label="#1">1</span>' +
            '<div class="rec-board-featured-entry-main">' +
              '<div class="rec-board-featured-heading">' +
                '<h2 class="rec-board-featured-title">' +
                  '<span class="rec-board-featured-title-text">' + titleWithReleaseHtml(first) + '</span>' +
                '</h2>' +
                sideMetaHtml(first, tab) +
              '</div>' +
              notesClampHtml(
                first.notes || t('recommendations_page.no_notes', 'No notes yet.'),
                3,
                'rec-board-featured-notes'
              ) +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var rows = buildListRowsHtml(pageItems, tab);
    var listInner =
      rows ||
      '<p class="rec-board-list-empty i18n-text" data-i18n="recommendations_page.list_hint">' +
        escapeHtml(t('recommendations_page.list_hint', 'More picks will show up here.')) +
      '</p>';

    var paginationHtml = '';
    if (rest.length > LIST_PAGE_SIZE) {
      var prevDisabled = pageIndex <= 0;
      var nextDisabled = pageIndex >= totalPages - 1;
      var pageInfo = t('recommendations_page.page_info', '{current} / {total}')
        .replace('{current}', String(pageIndex + 1))
        .replace('{total}', String(totalPages));
      paginationHtml =
        '<div class="rec-board-pagination" data-tab="' + escapeHtml(tab) + '">' +
          '<button type="button" class="rec-board-page-btn" data-rec-page="prev"' +
            (prevDisabled ? ' disabled aria-disabled="true"' : '') +
            ' aria-label="' + escapeHtml(t('recommendations_page.prev_page', 'Previous')) + '">' +
            '<i class="fa-solid fa-chevron-left" aria-hidden="true"></i>' +
          '</button>' +
          '<span class="rec-board-page-info">' + escapeHtml(pageInfo) + '</span>' +
          '<button type="button" class="rec-board-page-btn" data-rec-page="next"' +
            (nextDisabled ? ' disabled aria-disabled="true"' : '') +
            ' aria-label="' + escapeHtml(t('recommendations_page.next_page', 'Next')) + '">' +
            '<i class="fa-solid fa-chevron-right" aria-hidden="true"></i>' +
          '</button>' +
        '</div>';
    }

    var listHtml =
      '<div class="rec-board-list-wrap">' +
        '<div class="rec-board-list" role="list">' + listInner + '</div>' +
        paginationHtml +
      '</div>';

    body.innerHTML =
      '<div class="rec-board-grid' + (pageIndex > 0 ? ' is-page-rest' : '') + '" data-tab="' + escapeHtml(tab) + '">' +
        labelHtml + featuredMain + listHtml +
      '</div>';
    requestAnimationFrame(function () {
      initNotesClamps(body);
    });
  }

  function setActiveTab(tab) {
    var tabs = document.querySelectorAll('.rec-board-tab');
    for (var i = 0; i < tabs.length; i++) {
      var btn = tabs[i];
      var on = btn.getAttribute('data-tab') === tab;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    }
    listPageByTab[tab] = 0;
    renderBoard(tab, 0);
  }

  function scrollRecBoardHeaderIntoView() {
    if (window.matchMedia && !window.matchMedia('(max-width: 640px)').matches) return;
    var board = document.getElementById('recBoard');
    if (!board) return;
    var siteHeader = document.querySelector('header.site-header');
    var offset = siteHeader ? siteHeader.getBoundingClientRect().height : 0;
    var top = board.getBoundingClientRect().top + window.pageYOffset - offset - 8;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }

  function init() {
    var pageRoot = document.getElementById('recommendationsPage') || document.getElementById('recBoard');
    if (!pageRoot) return;
    pageRoot.addEventListener('click', function (e) {
      var tabBtn = e.target.closest('.rec-board-tab');
      if (tabBtn) {
        setActiveTab(tabBtn.getAttribute('data-tab'));
        return;
      }
      var pageBtn = e.target.closest('.rec-board-page-btn');
      if (pageBtn && !pageBtn.disabled) {
        var pager = pageBtn.closest('.rec-board-pagination');
        var tab = 'tv';
        if (pager && pager.getAttribute('data-tab')) {
          tab = pager.getAttribute('data-tab');
        } else {
          var activeTab = document.querySelector('.rec-board-tab.is-active');
          if (activeTab) tab = activeTab.getAttribute('data-tab') || 'tv';
        }
        var cur = listPageByTab[tab] || 0;
        var dir = pageBtn.getAttribute('data-rec-page');
        renderBoard(tab, dir === 'next' ? cur + 1 : cur - 1);
        requestAnimationFrame(scrollRecBoardHeaderIntoView);
        return;
      }
      var recentPageBtn = e.target.closest('.rec-recent-page-btn');
      if (recentPageBtn && !recentPageBtn.disabled) {
        var recentPager = recentPageBtn.closest('.rec-recent-pagination');
        var recentTab = recentPager && recentPager.getAttribute('data-recent-tab');
        if (!recentTab) return;
        var recentCur = recentPageByTab[recentTab] || 0;
        var recentDir = recentPageBtn.getAttribute('data-recent-page');
        var recentData = getRecentData() || {};
        var recentAll = Array.isArray(recentData[recentTab]) ? recentData[recentTab] : [];
        var recentItems = filterRecentItems(recentAll, recentTab);
        var recentTotal = Math.max(1, Math.ceil(recentItems.length / RECENT_PAGE_SIZE) || 1);
        var nextPage = recentCur;
        if (recentDir === 'first') nextPage = 0;
        else if (recentDir === 'prev') nextPage = recentCur - 1;
        else if (recentDir === 'next') nextPage = recentCur + 1;
        else if (recentDir === 'last') nextPage = recentTotal - 1;
        if (nextPage < 0) nextPage = 0;
        if (nextPage > recentTotal - 1) nextPage = recentTotal - 1;
        recentPageByTab[recentTab] = nextPage;
        renderRecentCardBody(recentTab);
        return;
      }
      var moreBtn = e.target.closest('.rec-notes-clamp-more');
      if (moreBtn) {
        expandNotesClamp(moreBtn.closest('.rec-notes-clamp'));
        return;
      }
      var lessBtn = e.target.closest('.rec-notes-clamp-less');
      if (lessBtn) {
        collapseNotesClamp(lessBtn.closest('.rec-notes-clamp'));
        return;
      }
      var recentItem = e.target.closest('.rec-recent-item');
      if (recentItem && recentItem.classList.contains('is-meta-expandable')) {
        toggleRecentItemMeta(recentItem);
      }
    });

    function applyRecentSearch(searchInput) {
      var searchTab = searchInput.getAttribute('data-recent-search');
      if (!searchTab) return;
      recentSearchByTab[searchTab] = searchInput.value || '';
      recentPageByTab[searchTab] = 0;
      renderRecentCardBody(searchTab);
    }

    pageRoot.addEventListener('input', function (e) {
      var searchInput = e.target.closest('.rec-recent-search-input');
      if (!searchInput) return;
      // Avoid tearing down IME composition (Chinese/Japanese/etc.)
      if (e.isComposing || e.inputType === 'insertCompositionText') return;
      applyRecentSearch(searchInput);
    });

    pageRoot.addEventListener('compositionend', function (e) {
      var searchInput = e.target && e.target.classList && e.target.classList.contains('rec-recent-search-input')
        ? e.target
        : (e.target.closest && e.target.closest('.rec-recent-search-input'));
      if (!searchInput) return;
      applyRecentSearch(searchInput);
    });

    pageRoot.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (e.isComposing || e.keyCode === 229) return;
      var searchInput = e.target.closest('.rec-recent-search-input');
      if (!searchInput) return;
      if (!searchInput.value) return;
      recentSearchByTab[searchInput.getAttribute('data-recent-search')] = '';
      searchInput.value = '';
      recentPageByTab[searchInput.getAttribute('data-recent-search')] = 0;
      renderRecentCardBody(searchInput.getAttribute('data-recent-search'));
    });

    var resizeTimer = null;
    var lastClampWidth = window.innerWidth;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        var width = window.innerWidth;
        // Mobile browser chrome show/hide fires resize with height-only change;
        // keep expanded notes open unless the layout width actually changes.
        if (width === lastClampWidth) return;
        lastClampWidth = width;
        var scope = document.getElementById('recommendationsPage') || document.getElementById('recBoardBody');
        if (!scope) return;
        var roots = scope.querySelectorAll('.rec-notes-clamp');
        for (var i = 0; i < roots.length; i++) {
          var root = roots[i];
          if (root.classList.contains('is-expanded')) continue;
          fitNotesClamp(root);
        }
        markRecentExpandable(scope);
      }, 150);
    });

    setActiveTab('tv');
    renderRecentSection();
  }

  document.addEventListener('lang-applied', function () {
    var active = document.querySelector('.rec-board-tab.is-active');
    recentPageByTab = {};
    recentSearchByTab = {};
    setActiveTab(active ? active.getAttribute('data-tab') : 'tv');
    renderRecentSection();
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

      var nav = header.querySelector('#site-nav');
      var backdrop = header.querySelector('.nav-backdrop');
      if (!toggle || !nav) return;

      function updateHeaderHeightVar() {
        var h = header.offsetHeight || 0;
        document.documentElement.style.setProperty('--site-header-height', h + 'px');
      }

      updateHeaderHeightVar();

      if (location.hash === '#home-achievements') {
        var alignAchievements = function () {
          var target = document.getElementById('home-achievements');
          if (!target) return;
          var h = header.offsetHeight || 72;
          var top = target.getBoundingClientRect().top + window.pageYOffset - h - 1;
          window.scrollTo(0, Math.max(0, Math.round(top)));
        };
        requestAnimationFrame(function () {
          requestAnimationFrame(alignAchievements);
        });
        window.addEventListener('load', function () {
          setTimeout(alignAchievements, 50);
        });
      }

      function lockScroll() {
        var scrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.dataset.navScrollY = String(scrollY);
        document.body.classList.add('nav-locked');
        document.body.style.position = 'fixed';
        document.body.style.top = '-' + scrollY + 'px';
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }

      function unlockScroll() {
        var scrollY = parseInt(document.body.dataset.navScrollY || '0', 10) || 0;
        document.body.classList.remove('nav-locked');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        delete document.body.dataset.navScrollY;
        window.scrollTo(0, scrollY);
      }

      function setOpen(open) {
        if (open === header.classList.contains('nav-open')) return;
        header.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) lockScroll();
        else unlockScroll();
      }

      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        setOpen(!header.classList.contains('nav-open'));
      });

      nav.addEventListener('click', function(e) {
        var link = e.target && e.target.closest ? e.target.closest('a') : null;
        if (link) setOpen(false);
      });

      document.addEventListener('click', function(e) {
        if (header.classList.contains('nav-open') && !header.contains(e.target)) setOpen(false);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && header.classList.contains('nav-open')) setOpen(false);
      });

      window.addEventListener('resize', function() {
        updateHeaderHeightVar();
        if (window.innerWidth > 768 && header.classList.contains('nav-open')) setOpen(false);
      });

      if (backdrop) {
        backdrop.addEventListener('click', function() {
          if (header.classList.contains('nav-open')) setOpen(false);
        });
      }
    })();
  </script>
</body>

</html>

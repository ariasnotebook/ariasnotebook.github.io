        var body = document.body;
        var label = document.getElementById('lang-switch-label');
        if (label) label.textContent = lang === 'zh-CN' ? 'EN' : 'CN';
        var isHome = body && body.classList.contains('layout-index');
        var siteTitle = (strings.title) || "Aria's Notebook";
        var siteSubtitle = (strings.subtitle) || "The Life Journal of an Earthling";
        function setDocumentTitle(nextTitle) {
          document.title = nextTitle;
          var metaTitle = document.querySelector('meta[name="title"]');
          if (metaTitle) metaTitle.setAttribute('content', nextTitle);
          var ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) ogTitle.setAttribute('content', nextTitle);
        }
        function setMetaDescription(nextDesc) {
          if (nextDesc == null || nextDesc === '') return;
          var metaDesc = document.querySelector('meta[name="description"]');
          if (metaDesc) metaDesc.setAttribute('content', nextDesc);
          var ogDesc = document.querySelector('meta[property="og:description"]');
          if (ogDesc) ogDesc.setAttribute('content', nextDesc);
        }
        if (typeof window.__applyMetaLang === 'function') {
          window.__applyMetaLang(lang);
        } else if (isHome) {
          setDocumentTitle(siteTitle + (siteSubtitle ? (' | ' + siteSubtitle) : ''));
        } else if (body) {
          var te = body.getAttribute('data-page-title-en');
          var tz = body.getAttribute('data-page-title-zh');
          if (te != null && tz != null) {
            var pageTitle = lang === 'zh-CN' ? tz : te;
            setDocumentTitle(pageTitle ? (pageTitle + ' | ' + siteTitle) : (siteTitle + ' | ' + siteSubtitle));
          }
          var de = body.getAttribute('data-page-desc-en');
          var dz = body.getAttribute('data-page-desc-zh');
          if (de != null || dz != null) {
            setMetaDescription(lang === 'zh-CN' ? (dz || de || '') : (de || dz || ''));
          }
        }
        var nodes = document.querySelectorAll('[data-i18n], .lang-content[data-lang]');
        for (var i = 0, n = nodes.length; i < n; i++) {
          var el = nodes[i];
          var key = el.getAttribute('data-i18n');
          if (key != null) {
            var text = strings[key];
            if (text != null) {
              var span = el.querySelector('.i18n-text');
              if (span) span.textContent = text;
              else el.textContent = text;
            }
          } else el.style.display = el.getAttribute('data-lang') === lang ? '' : 'none';
        }
        document.dispatchEvent(new CustomEvent('lang-applied', { detail: { lang: lang } }));
      }
      window.switchLang = function() { setLang(getLang() === 'en' ? 'zh-CN' : 'en'); };
      window.__i18n = i18n;
      window.__getLang = getLang;
      window.__applyLang = applyLang;
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function() { applyLang(getLang()); });
      else applyLang(getLang());
    })();
  </script>

  <script async src="https://cdn.snipcart.com/themes/v3.4.0/default/snipcart.js"></script>
  <div hidden id="snipcart"
       data-api-key="YOUR_SNIPCART_API_KEY"
       data-config-modal-style="side"
       data-config-add-product-behavior="none"
       data-config-currency="usd"
       data-config-payment-methods="card,alipay">
  </div>

  <script>
    (function() {
      var header = document.querySelector('header.site-header');
      if (!header) return;

      var toggle = header.querySelector('.nav-toggle');
      var nav = header.querySelector('#site-nav');
      var backdrop = header.querySelector('.nav-backdrop');
      if (!toggle || !nav) return;

      function updateHeaderHeightVar() {
        var h = header.offsetHeight || 0;
        document.documentElement.style.setProperty('--site-header-height', h + 'px');
      }

      updateHeaderHeightVar();

      if (location.hash === '#home-achievements') {
        var alignAchievements = function () {
          var target = document.getElementById('home-achievements');
          if (!target) return;
          var h = header.offsetHeight || 72;
          var top = target.getBoundingClientRect().top + window.pageYOffset - h - 1;
          window.scrollTo(0, Math.max(0, Math.round(top)));
        };
        requestAnimationFrame(function () {
          requestAnimationFrame(alignAchievements);
        });
        window.addEventListener('load', function () {
          setTimeout(alignAchievements, 50);
        });
      }

      function lockScroll() {
        var scrollY = window.scrollY || document.documentElement.scrollTop || 0;
        document.body.dataset.navScrollY = String(scrollY);
        document.body.classList.add('nav-locked');
        document.body.style.position = 'fixed';
        document.body.style.top = '-' + scrollY + 'px';
        document.body.style.left = '0';
        document.body.style.right = '0';
        document.body.style.width = '100%';
      }

      function unlockScroll() {
        var scrollY = parseInt(document.body.dataset.navScrollY || '0', 10) || 0;
        document.body.classList.remove('nav-locked');
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.left = '';
        document.body.style.right = '';
        document.body.style.width = '';
        delete document.body.dataset.navScrollY;
        window.scrollTo(0, scrollY);
      }

      function setOpen(open) {
        if (open === header.classList.contains('nav-open')) return;
        header.classList.toggle('nav-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (open) lockScroll();
        else unlockScroll();
      }

      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        setOpen(!header.classList.contains('nav-open'));
      });

      nav.addEventListener('click', function(e) {
        var link = e.target && e.target.closest ? e.target.closest('a') : null;
        if (link) setOpen(false);
      });

      document.addEventListener('click', function(e) {
        if (header.classList.contains('nav-open') && !header.contains(e.target)) setOpen(false);
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && header.classList.contains('nav-open')) setOpen(false);
      });

      window.addEventListener('resize', function() {
        updateHeaderHeightVar();
        if (window.innerWidth > 768 && header.classList.contains('nav-open')) setOpen(false);
      });

      if (backdrop) {
        backdrop.addEventListener('click', function() {
          if (header.classList.contains('nav-open')) setOpen(false);
        });
      }
    })();
  </script>
</body>
